<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>011 Frame Number Checker</title>
  <meta name="description" content="Check if your 011 frame number is on the list." />
  <style>
    :root { --bg:#0b0f19; --card:#121a2a; --text:#e7edf7; --muted:#a7b3c7; --good:#2dd4bf; --bad:#fb7185; --warn:#fbbf24; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji"; background: radial-gradient(1200px 800px at 15% 10%, #1a2650 0%, var(--bg) 55%); color: var(--text); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 48px 18px; }
    .card { background: rgba(18,26,42,0.88); border:1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 22px; box-shadow: 0 16px 45px rgba(0,0,0,0.38); backdrop-filter: blur(6px); }
    h1 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 40px); letter-spacing: -0.02em; }
    p { margin: 8px 0; color: var(--muted); line-height: 1.5; }
    .row { display:flex; gap:12px; margin-top: 16px; flex-wrap: wrap; }
    input { flex: 1 1 320px; padding: 14px 14px; border-radius: 12px; border:1px solid rgba(255,255,255,0.14); background: rgba(11,15,25,0.55); color: var(--text); font-size: 16px; outline: none; }
    input:focus { border-color: rgba(45,212,191,0.6); box-shadow: 0 0 0 4px rgba(45,212,191,0.12); }
    button { padding: 14px 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, #2dd4bf, #60a5fa); color: #06101a; font-weight: 700; font-size: 16px; cursor: pointer; }
    button:hover { filter: brightness(1.04); }
    .result { margin-top: 16px; padding: 14px 14px; border-radius: 14px; border:1px solid rgba(255,255,255,0.10); background: rgba(11,15,25,0.35); }
    .tag { display:inline-block; font-size: 12px; padding: 4px 10px; border-radius: 999px; border:1px solid rgba(255,255,255,0.16); color: var(--muted); margin-right: 8px; }
    .ok { border-color: rgba(45,212,191,0.5); }
    .no { border-color: rgba(251,113,133,0.55); }
    .loading { border-color: rgba(251,191,36,0.45); }
    .kvs { margin-top: 10px; display:grid; grid-template-columns: 1fr; gap: 6px; }
    .kv { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
    .kv b { color: var(--text); }
    .footer { margin-top: 14px; font-size: 13px; color: rgba(231,237,247,0.72); }
    a { color: #93c5fd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .cta { margin-top: 12px; display:flex; gap:10px; flex-wrap: wrap; }
    .secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.14); }
    .secondary:hover { background: rgba(255,255,255,0.10); }
    .tiny { font-size: 12px; color: rgba(231,237,247,0.62); margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>011 Frame Number Checker</h1>
      <p>Enter your frame number below. We’ll check if it appears in our list.</p>

      <div class="row">
        <input id="sn" inputmode="text" autocomplete="off" placeholder="e.g. 011XXXX or 1180614159" />
        <button id="btn">Check</button>
      </div>

      <div id="result" class="result loading" aria-live="polite">
        <span class="tag">Loading list…</span>
        <div class="footer" id="meta"></div>
      </div>

      <div class="tiny">
        Tip: You can paste the full value — we’ll ignore spaces and symbols.
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
